# ============================================================
#  Server block para un nginx INSTALADO EN EL HOST
#  (no el del contenedor — ese es nginx/templates/)
#
#  Usalo cuando el VPS ya tiene nginx sirviendo otros sitios y no
#  podés ocupar el puerto 80 con un segundo nginx en Docker.
#
#  Instalación:
#    cp nginx/host/wppcrm.conf /etc/nginx/sites-available/wppcrm
#    ln -s /etc/nginx/sites-available/wppcrm /etc/nginx/sites-enabled/wppcrm
#    nginx -t && systemctl reload nginx
#    certbot --nginx -d wppcrm.llegadasqr.site
#
#  certbot --nginx agrega solo el listen 443, el certificado y la
#  redirección desde HTTP. No hace falta tocar nada más acá.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name wppcrm.llegadasqr.site;

    # 64 MB: los adjuntos de WhatsApp llegan hasta ese tamaño.
    client_max_body_size 64m;

    access_log /var/log/nginx/wppcrm.access.log;
    error_log  /var/log/nginx/wppcrm.error.log;

    # Comprimir el JS/CSS/JSON baja mucho el tiempo de carga del CRM.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/x-javascript text/xml application/xml image/svg+xml;

    # --- WebSocket: QR en vivo, mensajes entrantes, progreso de difusión ---
    # Si falta este bloque, la app carga pero el QR nunca se actualiza solo
    # y los mensajes no aparecen hasta recargar la página.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
