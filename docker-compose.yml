services:
  db:
    image: postgres:16-alpine
    container_name: wppcrm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [wppcrm]

  app:
    build: ./server
    container_name: wppcrm_app
    restart: unless-stopped
    # Chromium necesita memoria compartida: sin esto las sesiones crashean.
    shm_size: "1gb"
    # Tiempo para que Chromium cierre prolijo antes del SIGKILL. Si lo matan
    # de golpe deja un SingletonLock que traba el arranque siguiente.
    stop_grace_period: 30s
    # Publicado SOLO en loopback: lo alcanza un nginx del host, nunca internet.
    # Si usás el nginx en contenedor (perfil "proxy"), esto es inofensivo.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_NAME: ${OWNER_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS}
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - wa_tokens:/app/data/tokens
      - wa_media:/app/data/media
    networks: [wppcrm]

  # ------------------------------------------------------------------
  #  nginx y certbot solo arrancan con:  docker compose --profile proxy up -d
  #  Si el VPS ya tiene su propio nginx (sirviendo otros sitios), NO los uses:
  #  dos nginx no pueden compartir el puerto 80. Ver DEPLOY.md, "Opción B".
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: wppcrm_nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
    volumes:
      # Los .template pasan por envsubst y salen a /etc/nginx/conf.d (así ${DOMAIN} funciona)
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    networks: [wppcrm]

  certbot:
    image: certbot/certbot:latest
    container_name: wppcrm_certbot
    profiles: ["proxy"]
    # Renueva el certificado cada 12 h. La primera emisión es manual (ver DEPLOY.md).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks: [wppcrm]

volumes:
  db_data:
  wa_tokens:
  wa_media:

networks:
  wppcrm:
    driver: bridge
